<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мокап просмотра видео | Youvi</title>
  <style>
    :root {
      --bg: #ffffff;
      --chrome: #f2f2f7;
      --field: #f2f2f7;
      --line: #d8d8de;
      --text: #111111;
      --muted: #7a7a85;
      --accent: #ff4f9f;
      --type-channel: #9ca3af;
      --type-general: #6b7280;
      --type-character: #6b9e4d;
      --type-author: #ef6c7d;
      --type-genre: #6b9bd1;
      --type-type: #f59e6c;
      --type-year: #eab676;
      --type-studio: #f28b8b;
      --type-category: #67c5d6;
      --type-rating: #f5a3c7;
      --type-anime: #a78bdb;
      --type-serial: #8db8d6;
      --type-movie: #d4a373;
      --type-animation: #9dd6a8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; background: var(--chrome); color: var(--text); line-height: 1.35; }
    .phone { max-width: 430px; min-height: 100vh; margin: 0 auto; background: var(--bg); border-left: 1px solid #e4e4ea; border-right: 1px solid #e4e4ea; }
    .app { padding: calc(8px + var(--safe-top)) 16px 18px; }

    .top {
      position: sticky; top: 0; z-index: 11; margin: 0 -16px 10px; padding: 8px 16px;
      background: rgba(255,255,255,.92); border-bottom: 1px solid #ececf2;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px;
    }
    .top-btn { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: #fff; color: #333; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .top-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .top-title { text-align: center; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player {
      width: calc(100% + 32px);
      margin: 0 -16px 4px;
      aspect-ratio: 16/9;
      background: #ececf1;
      position: relative;
      z-index: 6;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background-size: cover; background-position: center;
    }
    .player.following {
      position: fixed;
      top: calc(52px + var(--safe-top));
      left: var(--player-fixed-left, 0px);
      transform: none;
      width: var(--player-fixed-width, min(430px, 100vw));
      margin: 0;
      z-index: 10;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      transition: box-shadow 0.2s ease;
    }
    .player-placeholder {
      display: none;
      height: 0;
    }
    .player-placeholder.active {
      display: block;
    }
    .player::after { content: ""; position: absolute; inset: auto 0 0; height: 44%; background: linear-gradient(to top, rgba(0,0,0,.55), transparent); pointer-events: none; }
    .big-play { width: 58px; height: 58px; border: none; border-radius: 999px; background: rgba(0,0,0,.52); color: #fff; display: inline-flex; align-items: center; justify-content: center; z-index: 2; }
    .big-play svg { width: 26px; height: 26px; fill: currentColor; }
    .player-top-badge { position: absolute; left: 8px; top: 8px; z-index: 2; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff; padding: 3px 6px; background: rgba(255,79,159,.92); }
    .player-badge { position: absolute; right: 8px; bottom: 8px; z-index: 2; border-radius: 5px; background: rgba(0,0,0,.75); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 6px; }

    .player-controls { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; }
    .progress { height: 3px; width: 100%; background: rgba(255,255,255,.3); border-radius: 6px; overflow: hidden; margin-bottom: 7px; }
    .progress > div { height: 100%; width: 28%; background: var(--accent); }
    .player-row { display: flex; align-items: center; justify-content: space-between; color: #fff; font-size: 12px; }

    .danmaku-box {
      border: none;
      border-bottom: 1px solid #ececf2;
      background: transparent;
      padding: 8px 0;
      margin-bottom: 12px;
    }
    .danmaku-inline {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: nowrap;
    }
    .dmk-btn {
      border: 1px solid #d8d8de;
      background: #fff;
      color: #4c4c57;
      border-radius: 10px;
      width: 36px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .dmk-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dmk-color-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.08);
      background: #ffffff;
    }
    .danmaku-input {
      flex: 1;
      border: none;
      border-radius: 10px;
      background: var(--field);
      color: var(--text);
      min-height: 34px;
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      min-width: 0;
    }
    .danmaku-send {
      border: none;
      border-radius: 10px;
      width: 40px;
      min-height: 34px;
      padding: 0 10px;
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .danmaku-send svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title { display: none; }
    .meta { display: flex; flex-wrap: wrap; gap: 5px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }

    .channel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #ffd2e8; color: #923567; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
    .channel-meta { min-width: 0; flex: 1; }
    .channel-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-stats { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .sub-btn { border: none; border-radius: 17px; background: var(--accent); color: #fff; min-height: 34px; padding: 0 14px; font-size: 14px; font-weight: 600; }

    .actions {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 12px;
    }
    .action {
      border: none;
      border-radius: 18px;
      background: var(--field);
      color: #4b4b56;
      width: 100%;
      min-width: 0;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .action svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .action.active { background: #ffedf6; color: var(--accent); }

    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .tag { border-radius: 16px; padding: 6px 11px; font-size: 13px; line-height: 1; background: #f1f1f5; color: #444; text-decoration: none; }
    .tag[data-type="channel"] { background: color-mix(in srgb, var(--type-channel) 22%, white); color: color-mix(in srgb, var(--type-channel) 84%, #1f2937); }
    .tag[data-type="general"] { background: color-mix(in srgb, var(--type-general) 18%, white); color: color-mix(in srgb, var(--type-general) 82%, #1f2937); }
    .tag[data-type="character"] { background: color-mix(in srgb, var(--type-character) 22%, white); color: color-mix(in srgb, var(--type-character) 84%, #1f2937); }
    .tag[data-type="author"] { background: color-mix(in srgb, var(--type-author) 20%, white); color: color-mix(in srgb, var(--type-author) 84%, #1f2937); }
    .tag[data-type="genre"] { background: color-mix(in srgb, var(--type-genre) 20%, white); color: color-mix(in srgb, var(--type-genre) 84%, #1f2937); }
    .tag[data-type="type"] { background: color-mix(in srgb, var(--type-type) 24%, white); color: color-mix(in srgb, var(--type-type) 84%, #1f2937); }
    .tag[data-type="year"] { background: color-mix(in srgb, var(--type-year) 26%, white); color: color-mix(in srgb, var(--type-year) 84%, #1f2937); }
    .tag[data-type="studio"] { background: color-mix(in srgb, var(--type-studio) 22%, white); color: color-mix(in srgb, var(--type-studio) 84%, #1f2937); }
    .tag[data-type="category"] { background: color-mix(in srgb, var(--type-category) 24%, white); color: color-mix(in srgb, var(--type-category) 84%, #1f2937); }
    .tag[data-type="rating"] { background: color-mix(in srgb, var(--type-rating) 26%, white); color: color-mix(in srgb, var(--type-rating) 84%, #1f2937); }
    .tag[data-type="anime"] { background: color-mix(in srgb, var(--type-anime) 22%, white); color: color-mix(in srgb, var(--type-anime) 84%, #1f2937); }
    .tag[data-type="serial"] { background: color-mix(in srgb, var(--type-serial) 24%, white); color: color-mix(in srgb, var(--type-serial) 84%, #1f2937); }
    .tag[data-type="movie"] { background: color-mix(in srgb, var(--type-movie) 24%, white); color: color-mix(in srgb, var(--type-movie) 84%, #1f2937); }
    .tag[data-type="animation"] { background: color-mix(in srgb, var(--type-animation) 24%, white); color: color-mix(in srgb, var(--type-animation) 84%, #1f2937); }

    .section-nav {
      position: sticky;
      top: calc(52px + var(--safe-top));
      z-index: 9;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      gap: 0;
      padding: 0;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid #ececf2;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }
    .section-nav::-webkit-scrollbar {
      display: none;
    }
    .section-nav a {
      text-decoration: none;
      text-align: center;
      color: #666673;
      font-size: 13px;
      font-weight: 600;
      border-radius: 0;
      min-height: 44px;
      min-width: 96px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      padding: 0 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: transparent;
      border-bottom: 3px solid transparent;
      transition: border-color 0.2s;
    }
    .section-nav a.active {
      color: var(--accent);
      background: transparent;
      border-bottom-color: var(--accent);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .block { margin-bottom: 12px; }
    .block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .block-title { font-size: 13px; font-weight: 700; color: #555564; text-transform: uppercase; letter-spacing: 0.5px; }
    .desc-card {
      border: 1px solid #ececf2;
      border-radius: 14px;
      background: #fafafe;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .desc-head {
      width: 100%;
      border: none;
      background: transparent;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #26262e;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .desc-icon {
      color: #8a8a95;
      font-size: 16px;
      transition: transform 0.2s;
    }
    .desc-card.collapsed .desc-icon {
      transform: rotate(-90deg);
    }
    .desc-content {
      padding: 0 12px 12px;
    }
    .desc-card.collapsed .desc-content {
      display: none;
    }
    .description { font-size: 14px; color: #43434d; white-space: pre-line; line-height: 1.45; }

    .transcript-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .transcript-tools {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .transcript-source {
      border: 1px solid #e4e4ec;
      background: #fff;
      border-radius: 14px;
      height: 28px;
      padding: 0 8px;
      font-size: 12px;
      color: #3a3a44;
      max-width: 160px;
    }
    .transcript-follow {
      border: 1px solid #e4e4ec;
      background: #fff;
      color: #5b5b67;
      border-radius: 999px;
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .transcript-follow svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .transcript-follow.active {
      background: #ffedf6;
      border-color: #ffd3e7;
      color: var(--accent);
    }
    .transcript-list {
      display: grid;
      gap: 2px;
      max-height: 440px;
      overflow: auto;
      padding-right: 1px;
    }
    .transcript-line {
      display: grid;
      grid-template-columns: 52px 1fr;
      align-items: start;
      gap: 7px;
      border-radius: 10px;
      padding: 9px 8px;
      color: #353540;
      font-size: 13px;
      line-height: 1.35;
      cursor: pointer;
    }
    .transcript-line:hover { background: #f7f7fb; }
    .transcript-line.active { background: #ffedf6; }
    .transcript-time {
      color: #8d8d99;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      padding-top: 1px;
    }
    .transcript-text {
      color: #1b1b22;
      line-height: 1.38;
    }
    .danmaku-print-list {
      display: grid;
      gap: 2px;
      max-height: 440px;
      overflow: auto;
      padding-right: 1px;
    }

    .pc-mobile {
      border: 1px solid #ececf2;
      border-radius: 14px;
      background: #ffffff;
      padding: 10px;
    }
    .pc-mobile-title {
      font-size: 13px;
      color: #4a4a56;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .pc-mobile-group + .pc-mobile-group {
      margin-top: 10px;
    }
    .pc-mobile-label {
      font-size: 12px;
      color: #7c7c89;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .pc-mobile-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: calc(50% - 5px);
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }
    .pc-mobile-row::-webkit-scrollbar {
      display: none;
    }
    .pc-mobile-card {
      text-decoration: none;
      color: inherit;
      display: block;
      min-width: 0;
      scroll-snap-align: center;
    }
    .pc-mobile-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      background: #ececf1;
      position: relative;
      overflow: hidden;
      margin-bottom: 6px;
      background-size: cover;
      background-position: center;
    }
    .pc-mobile-duration {
      position: absolute;
      right: 5px;
      bottom: 5px;
      background: rgba(0,0,0,.72);
      color: #fff;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 600;
    }
    .pc-mobile-name {
      font-size: 12px;
      line-height: 1.3;
      font-weight: 600;
      color: #2b2b34;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pc-mobile-meta {
      margin-top: 3px;
      font-size: 11px;
      color: #8a8a95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pc-mobile-carousel {
      position: relative;
    }
    .pc-nav-btn {
      border: 1px solid #e7e7ee;
      background: #fff;
      color: #6b6b76;
      border-radius: 999px;
      width: 26px;
      height: 26px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      position: absolute;
      top: 30%;
      z-index: 2;
      box-shadow: 0 1px 6px rgba(0,0,0,.14);
    }
    .pc-nav-btn.prev {
      left: 0;
      transform: translate(-50%, -50%);
    }
    .pc-nav-btn.next {
      right: 0;
      transform: translate(50%, -50%);
    }

    .comments-toolbar { display: flex; justify-content: flex-end; margin-bottom: 14px; padding-bottom: 0; border-bottom: none; }
    .comments-sort-text {
      font-size: 12px;
      color: #9a9aa4;
      font-weight: 500;
      letter-spacing: 0;
    }
    .comments-compose {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: min(430px, 100vw);
      bottom: 0;
      background: rgba(255, 255, 255, 0.98);
      padding: 12px 0;
      margin: 0;
      padding-left: 16px;
      padding-right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #f0f0f5;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
      padding-bottom: calc(12px + var(--safe-bottom));
    }
    .comments-compose.hidden {
      display: none;
    }
    .comments-compose-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b9d, #ff8fa3);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .comments-compose-inner {
      flex: 1;
      display: flex;
      gap: 0;
      align-items: center;
      background: #f5f5f8;
      border-radius: 20px;
      padding: 0 14px;
      height: 36px;
    }
    .comments-nick {
      display: none;
    }
    .comments-text {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      height: 36px;
      padding: 6px 0 0;
      font-size: 14px;
      color: #2f2f38;
      outline: none;
      font-family: inherit;
      resize: none;
      line-height: 1.4;
    }
    .comments-text::placeholder {
      color: #b0b0ba;
    }
    .comments-text:focus {
      outline: none;
    }
    .comments-nick:focus {
      outline: none;
    }
    .comments-icons {
      display: flex;
      gap: 0;
      align-items: center;
    }
    .comments-icon-btn {
      border: none;
      background: transparent;
      color: #b0b0ba;
      width: 28px;
      height: 28px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 16px;
    }
    .comments-send {
      border: none;
      background: transparent;
      color: var(--accent);
      padding: 0 4px;
      font-size: 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      width: 24px;
      height: 24px;
    }
    .comments-send::before {
      content: "→";
      font-size: 18px;
    }
    .comments-list {
      display: grid;
      gap: 2px;
      padding-bottom: 96px;
    }
    .comment-item {
      display: grid;
      grid-template-columns: 36px 1fr 46px;
      gap: 10px;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 10px 0;
      border-bottom: none;
      align-items: start;
    }
    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b9d, #ff8fa3);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .comment-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .comment-header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .comment-author {
      font-size: 13px;
      font-weight: 700;
      color: #111111;
    }
    .comment-author-badge {
      font-size: 10px;
      font-weight: 700;
      color: #ff4f9f;
      background: transparent;
      padding: 0;
      border-radius: 0;
      display: inline-block;
    }
    .comment-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: #8b8b95;
    }
    .comment-meta-dot {
      display: none;
    }
    .comment-text {
      font-size: 13px;
      color: #17171c;

    function escapeHtml(text) {
      return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatViews(value) {
      var n = Number(value) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    function normalizeDuration(value) {
      var s = String(value || '').trim();
      if (/^\d+:\d{2}(:\d{2})?$/.test(s)) return s;
      var sec = Number(s);
      if (!Number.isFinite(sec) || sec < 0) return '0:00';
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), z = Math.floor(sec % 60);
      return h > 0 ? h + ':' + String(m).padStart(2,'0') + ':' + String(z).padStart(2,'0') : m + ':' + String(z).padStart(2,'0');
    }

    function getNameFromQuery() {

    function getTagType(tagText) {
      var m = /\(([^)]+)\)\s*$/.exec(String(tagText || ''));
      if (!m) return 'general';
      var code = String(m[1] || '').trim().toLowerCase();
      if (code === 'ka') return 'channel';
      if (code === 'gt') return 'general';
      if (code === 'ch') return 'character';
      if (code === 'ar' || code === 'au') return 'author';
      if (code === 'ge') return 'genre';
      if (code === 'tp') return 'type';
      if (code === 'yr') return 'year';
      if (code === 'sd' || code === 'st') return 'studio';
      if (code === 'ct') return 'category';
      if (code === 'ra' || code === 'rt') return 'rating';
      if (code === 'at') return 'anime';
      if (code === 'ser') return 'serial';
      if (code === 'mt') return 'movie';
      if (code === 'nat' || code === 'ant') return 'animation';
      return 'general';
    }

    function getInitial(name) {
      var n = String(name || '').trim();

    function stringToColor(str) {
      var hash = 0;
      var source = String(str || 'U');
      for (var i = 0; i < source.length; i++) {
        hash = source.charCodeAt(i) + ((hash << 5) - hash);
      }
      var color = (hash & 0x00FFFFFF).toString(16).toUpperCase();
      return '#' + ('000000'.substring(0, 6 - color.length) + color);
    }

    function getAvatarStyleAttr(name) {
      return ' style="background:' + stringToColor(name) + ';color:#fff;"';
    }

    function getRepliesLabel(count) {
      var n = Math.abs(Number(count) || 0);
      var mod10 = n % 10;
      var mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return 'ответ';
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'ответа';
      return 'ответов';
    }

            }).join('') + '</div>';

          threadMarkup = '<div class="comment-thread">' + inlineUnderComment + (replies.length ? repliesMarkup : '') + '</div>';

    function formatCommentTime(ts) {
      var n = Number(ts);
      if (!Number.isFinite(n)) return 'только что';
      var diff = Math.max(0, Math.floor((Date.now() - n) / 60000));
      if (diff < 1) return 'только что';
      if (diff < 60) return diff + ' мин назад';
      var h = Math.floor(diff / 60);
      if (h < 24) return h + ' ч назад';
      var d = Math.floor(h / 24);
      return d + ' д назад';
    }

    function initCommentsComposer() {
      var textInput = document.getElementById('commentInput');
      var postBtn = document.getElementById('postComment');
      var composerAvatar = document.getElementById('composerAvatar');
      if (!textInput || !postBtn) return;

      if (composerAvatar) {
        composerAvatar.style.background = stringToColor('Вы');
        composerAvatar.style.color = '#fff';
      }

      function submitComment() {
        var text = String(textInput.value || '').trim();
        if (!text) return;
        commentsState.unshift({ id: 'c' + Date.now(), nick: 'Вы', text: text, likes: 0, createdAt: Date.now(), replies: [] });
        textInput.value = '';
        textInput.style.height = '36px';
        renderComments();
      }

      function autoGrowTextarea() {
        textInput.style.height = '36px';
        var scrollHeight = textInput.scrollHeight;
        textInput.style.height = Math.min(scrollHeight, 100) + 'px';
      }

      postBtn.addEventListener('click', submitComment);
      textInput.addEventListener('input', autoGrowTextarea);
      textInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          submitComment();
        }
      });

      var commentsList = document.getElementById('commentsList');
      commentsList.addEventListener('click', function (event) {
        var btn = event.target.closest('.comment-action, .comment-like-btn, .view-replies-btn, .inline-reply-send, .inline-reply-cancel');
        if (!btn) return;
        var item = event.target.closest('.comment-item');
        if (!item) return;
        var id = item.getAttribute('data-comment-id');
        var parentId = item.getAttribute('data-parent-comment-id');
        var replyId = item.getAttribute('data-reply-id');
        var action = btn.getAttribute('data-action');
        var index = commentsState.findIndex(function (c) { return String(c.id) === String(id); });
        var replyIndex = -1;

        if (index < 0 && parentId) {
          index = commentsState.findIndex(function (c) { return String(c.id) === String(parentId); });
          if (index >= 0) {
            var replies = Array.isArray(commentsState[index].replies) ? commentsState[index].replies : [];
            replyIndex = replies.findIndex(function (r, ridx) {
              var rid = String(r.id || (String(parentId) + '_r' + ridx));
              return rid === String(replyId);
            });
          }
        }

        if (index < 0) return;

        if (action === 'like') {
          if (replyIndex >= 0) {
            commentsState[index].replies[replyIndex].likes = Number(commentsState[index].replies[replyIndex].likes || 0) + 1;
          } else {
            commentsState[index].likes = Number(commentsState[index].likes || 0) + 1;
          }
          btn.classList.add('active');
          renderComments();
          return;
        }

        if (action === 'reply') {
          var targetNick = replyIndex >= 0 ? commentsState[index].replies[replyIndex].nick : commentsState[index].nick;
          var key = replyIndex >= 0
            ? makeReplyKey(commentsState[index].id, commentsState[index].replies[replyIndex].id || (String(commentsState[index].id) + '_r' + replyIndex))
            : makeCommentKey(commentsState[index].id);
          replyEditorState.key = key;
          replyEditorState.parentId = commentsState[index].id;
          replyEditorState.targetNick = targetNick;
          replyEditorState.text = '';
          openRepliesState[String(commentsState[index].id)] = true;
          renderComments();
          return;
        }

        if (action === 'cancel-inline-reply') {
          replyEditorState.key = null;
          replyEditorState.parentId = null;
          replyEditorState.targetNick = '';
          replyEditorState.text = '';
          renderComments();
          return;
        }

        if (action === 'send-inline-reply') {
          var replyText = String(replyEditorState.text || '').trim();
          if (!replyText || replyEditorState.parentId == null) return;
          var parentIndex = commentsState.findIndex(function (c) { return String(c.id) === String(replyEditorState.parentId); });
          if (parentIndex < 0) return;
          if (!Array.isArray(commentsState[parentIndex].replies)) commentsState[parentIndex].replies = [];
          commentsState[parentIndex].replies.push({
            id: 'r' + Date.now(),
            nick: 'Вы',
            text: replyText,
            likes: 0,
            createdAt: Date.now()
          });
          openRepliesState[String(replyEditorState.parentId)] = true;
          replyEditorState.key = null;
          replyEditorState.parentId = null;
          replyEditorState.targetNick = '';
          replyEditorState.text = '';
          renderComments();
          return;
        }

        if (action === 'toggle-replies') {
          var cid = String(commentsState[index].id);
          openRepliesState[cid] = !openRepliesState[cid];
          renderComments();
        }
      });

      commentsList.addEventListener('input', function (event) {
        var input = event.target.closest('.inline-reply-input');
        if (!input) return;
        replyEditorState.text = input.value || '';
      });
    }

    function initSectionNav() {
      var nav = document.getElementById('sectionNav');
      if (!nav) return;
      var links = Array.prototype.slice.call(nav.querySelectorAll('a[data-target]'));
      var compose = document.querySelector('.comments-compose');
      var player = document.getElementById('player');
      var playerPlaceholder = document.getElementById('playerPlaceholder');
      var danmaku = document.querySelector('.danmaku-box');
      var app = document.querySelector('.app');
      var phone = document.querySelector('.phone');
      var followThresholdY = 0;
      var followReleaseY = 0;
      var isFollowing = false;
      if (!links.length) return;

      function syncStickyMetrics() {
        if (!player || !phone) return;
        var phoneRect = phone.getBoundingClientRect();
        document.documentElement.style.setProperty('--player-fixed-width', phoneRect.width + 'px');
        document.documentElement.style.setProperty('--player-fixed-left', phoneRect.left + 'px');

        var topBar = document.querySelector('.top');
        var topHeight = topBar ? topBar.offsetHeight : 52;
        if (danmaku) {
          var danmakuBottomAbs = window.scrollY + danmaku.getBoundingClientRect().bottom;
          followThresholdY = Math.max(0, danmakuBottomAbs - topHeight - 2);
          followReleaseY = Math.max(0, danmakuBottomAbs - topHeight + 10);
        }
      }

      function updatePlayerFollow() {
        if (!player || !app) return;
        var y = window.scrollY;
        if (!isFollowing && y >= followThresholdY) {
          isFollowing = true;
        } else if (isFollowing && y <= followReleaseY) {
          isFollowing = false;
        }
        var shouldFollow = isFollowing;
        player.classList.toggle('following', shouldFollow);
        if (playerPlaceholder) {
          playerPlaceholder.classList.toggle('active', shouldFollow);
          playerPlaceholder.style.height = shouldFollow ? player.offsetHeight + 4 + 'px' : '0px';
        }
        document.documentElement.style.setProperty('--player-follow-h', shouldFollow ? player.offsetHeight + 4 + 'px' : '0px');
      }

      function activateTab(id) {
        links.forEach(function (link) {
          var targetId = link.getAttribute('data-target');
          var panel = document.getElementById(targetId);
          var active = targetId === id;
          link.classList.toggle('active', active);
          if (panel) panel.classList.toggle('active', active);
        });
        if (compose) compose.classList.toggle('hidden', id !== 'commentsSection');
        updatePlayerFollow();
      }

      links.forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          activateTab(link.getAttribute('data-target'));
        });
      });

      syncStickyMetrics();
      updatePlayerFollow();
      window.addEventListener('resize', function () {
        syncStickyMetrics();
        updatePlayerFollow();
      });
      window.addEventListener('scroll', updatePlayerFollow, { passive: true });
      activateTab('relatedSection');
    }

    function renderPlaylists(video) {
      var host = document.getElementById('playlistsList');
      var titleNode = document.getElementById('playlistsName');
      var subNode = document.getElementById('playlistsSub');
      if (!host) return;
      var baseTitle = String(video.name || 'Видео').replace(/\.[^.]+$/, '');
      var stem = baseTitle.replace(/\s*серия\s*\d+.*/i, '').trim() || baseTitle;
      var match = /серия\s*(\d+)/i.exec(baseTitle);
      var currentEpisode = match ? Number(match[1]) : 1;
      if (!Number.isFinite(currentEpisode) || currentEpisode < 1) currentEpisode = 1;

      if (titleNode) titleNode.textContent = stem + ' — плейлист';

      var source = [0, 1, 2, 3, 4, 5].map(function (offset) {
        var episode = Math.max(1, currentEpisode - 2 + offset);
        return {
          name: stem + ' серия ' + episode,
          duration: normalizeDuration(Number(video.duration) + offset * 12),
          views: Number(video.views || 0) + (offset + 1) * 900,
          position: offset + 1
        };
      });

      if (subNode) subNode.textContent = source.length + ' видео в плейлисте';

      var items = source.slice();
      if (playlistsSortState === 'asc') {
        items.sort(function (a, b) { return a.position - b.position; });
      } else if (playlistsSortState === 'rand') {
        for (var i = items.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = items[i];
          items[i] = items[j];
          items[j] = tmp;
        }
      } else {
        items.sort(function (a, b) { return b.position - a.position; });
      }

      host.innerHTML = items.map(function (item) {
        return '<a class="playlist-item" href="#">' +
          '<div class="playlist-thumb"><span class="playlist-count">' + escapeHtml(item.duration) + '</span></div>' +
          '<div>' +
          '<div class="playlist-title">' + escapeHtml(item.name) + '</div>' +
          '<div class="playlist-meta">№' + item.position + ' в плейлисте • ' + formatViews(item.views) + ' просмотров</div>' +
          '</div>' +
          '</a>';
      }).join('');
    }

    function initPlaylistsSection(video) {
      var sort = document.getElementById('playlistsSort');
      if (!sort) return;
      sort.value = playlistsSortState;
      if (!sort.dataset.bound) {
        sort.dataset.bound = '1';
        sort.addEventListener('change', function () {
          playlistsSortState = sort.value;
          renderPlaylists(video);
        });
      }
    }

    function renderParentChildMobile(video) {
      var childHost = document.getElementById('childLinks');
      var parentHost = document.getElementById('parentLinks');
      if (!childHost || !parentHost) return;

      var base = String(video.name || 'Видео').replace(/\.[^.]+$/, '');
      var childItems = [1, 2, 3].map(function (i) {
        return {
          name: base + ' — часть ' + i,
          duration: normalizeDuration(video.duration),
          meta: (video.uploader || 'Канал Youvi') + ' • ' + formatViews((Number(video.views) || 0) + i * 320) + ' просмотров'
        };
      });
      var parentItems = [1, 2].map(function (i) {
        return {
          name: 'Источник: ' + base + ' (' + i + ')',
          duration: normalizeDuration(video.duration),
          meta: 'Архивный выпуск • ' + formatViews((Number(video.views) || 0) + i * 510) + ' просмотров'
        };
      });

      function makeCards(items) {
        return items.map(function (item) {
          return '<a class="pc-mobile-card" href="youvi_video_mobile_mockup.html?v=' + encodeURIComponent(item.name) + '">' +
            '<div class="pc-mobile-thumb"><span class="pc-mobile-duration">' + item.duration + '</span></div>' +
            '<div class="pc-mobile-name">' + escapeHtml(item.name) + '</div>' +
            '<div class="pc-mobile-meta">' + escapeHtml(item.meta || '') + '</div>' +
            '</a>';
        }).join('');
      }

      childHost.innerHTML = makeCards(childItems);
      parentHost.innerHTML = makeCards(parentItems);
    }

    function initParentChildCarousels() {
      function bind(prevId, nextId, rowId) {
        var prev = document.getElementById(prevId);
        var next = document.getElementById(nextId);
        var row = document.getElementById(rowId);
        if (!prev || !next || !row) return;
        function step() {
          return Math.max(120, Math.round(row.clientWidth * 0.82));
        }
        prev.addEventListener('click', function () { row.scrollBy({ left: -step(), behavior: 'smooth' }); });
        next.addEventListener('click', function () { row.scrollBy({ left: step(), behavior: 'smooth' }); });
      }
      bind('childPrevBtn', 'childNextBtn', 'childLinks');
      bind('parentPrevBtn', 'parentNextBtn', 'parentLinks');
    }

    function initDescriptionSection() {
      var card = document.getElementById('descCard');
      var toggle = document.getElementById('descToggle');
      if (!card || !toggle) return;
      toggle.addEventListener('click', function () {
        card.classList.toggle('collapsed');
      });
    }

    function getTranscriptSources(video) {
      var sources = Array.isArray(video && video.transcriptSources) ? video.transcriptSources : [];
      if (sources.length) return sources;
      return [{
        id: 'sub_ru',
        label: 'Субтитры RU',
        cues: [{ time: '00:00', text: 'Транскрипт недоступен для этого видео.' }]
      }];
    }

    function renderTranscript(video) {
      var sourceSelect = document.getElementById('transcriptSource');
      var listHost = document.getElementById('transcriptList');
      if (!sourceSelect || !listHost) return;

      var sources = getTranscriptSources(video);
      if (!transcriptState.sourceId || !sources.some(function (s) { return s.id === transcriptState.sourceId; })) {
        transcriptState.sourceId = sources[0].id;
      }

      sourceSelect.innerHTML = sources.map(function (source) {
        var selected = source.id === transcriptState.sourceId ? ' selected' : '';
        return '<option value="' + escapeHtml(source.id) + '"' + selected + '>' + escapeHtml(source.label || source.id) + '</option>';
      }).join('');

      var activeSource = sources.find(function (s) { return s.id === transcriptState.sourceId; }) || sources[0];
      var cues = Array.isArray(activeSource.cues) ? activeSource.cues : [];
      if (transcriptState.activeIndex >= cues.length) transcriptState.activeIndex = 0;

      listHost.innerHTML = cues.map(function (cue, idx) {
        var active = idx === transcriptState.activeIndex ? ' active' : '';
        return '<div class="transcript-line' + active + '" data-idx="' + idx + '">' +
          '<span class="transcript-time">' + escapeHtml(cue.time || '00:00') + '</span>' +
          '<span class="transcript-text">' + escapeHtml(cue.text || '') + '</span>' +
          '</div>';
      }).join('');
    }

    function initTranscriptSection(video) {
      var sourceSelect = document.getElementById('transcriptSource');
      var followBtn = document.getElementById('transcriptFollowBtn');
      var listHost = document.getElementById('transcriptList');
      if (!sourceSelect || !followBtn || !listHost) return;

      function syncFollowButton() {
        followBtn.classList.toggle('active', transcriptState.followMode);
        followBtn.setAttribute('aria-pressed', transcriptState.followMode ? 'true' : 'false');
        followBtn.title = transcriptState.followMode ? 'Фоллов режим: вкл' : 'Фоллов режим: выкл';
      }

      if (!sourceSelect.dataset.bound) {
        sourceSelect.dataset.bound = '1';
        sourceSelect.addEventListener('change', function () {
          transcriptState.sourceId = sourceSelect.value;
          transcriptState.activeIndex = 0;
          renderTranscript(video);
        });
      }

      if (!followBtn.dataset.bound) {
        followBtn.dataset.bound = '1';
        followBtn.addEventListener('click', function () {
          transcriptState.followMode = !transcriptState.followMode;
          syncFollowButton();
        });
      }

      if (!listHost.dataset.bound) {
        listHost.dataset.bound = '1';
        listHost.addEventListener('click', function (event) {
          var line = event.target.closest('.transcript-line');
          if (!line) return;
          var idx = Number(line.getAttribute('data-idx'));
          if (!Number.isFinite(idx)) return;
          transcriptState.activeIndex = idx;
          renderTranscript(video);
        });
      }

      if (!transcriptState.timerId) {
        transcriptState.timerId = window.setInterval(function () {
          var panel = document.getElementById('transcriptSection');
          if (!panel || !panel.classList.contains('active') || !transcriptState.followMode) return;
          var sources = getTranscriptSources(video);
          var source = sources.find(function (s) { return s.id === transcriptState.sourceId; }) || sources[0];
          var cues = Array.isArray(source.cues) ? source.cues : [];
          if (!cues.length) return;
          transcriptState.activeIndex = (transcriptState.activeIndex + 1) % cues.length;
          renderTranscript(video);
          var activeLine = listHost.querySelector('.transcript-line.active');
          if (activeLine) activeLine.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }, 1800);
      }

      syncFollowButton();
      renderTranscript(video);
    }

    function getDanmakuPrintLines(video) {
      var lines = Array.isArray(video && video.danmakuPrint) ? video.danmakuPrint : [];
      if (lines.length) return lines;
      var sources = getTranscriptSources(video);
      var first = sources[0] || { cues: [] };
      return Array.isArray(first.cues) && first.cues.length
        ? first.cues
        : [{ time: '00:00', text: 'Распечатка данмаку недоступна.' }];
    }

    function renderDanmakuPrint(video) {
      var listHost = document.getElementById('danmakuPrintList');
      if (!listHost) return;
      var lines = getDanmakuPrintLines(video);
      if (danmakuPrintState.activeIndex >= lines.length) danmakuPrintState.activeIndex = 0;

      listHost.innerHTML = lines.map(function (line, idx) {
        var active = idx === danmakuPrintState.activeIndex ? ' active' : '';
        return '<div class="transcript-line' + active + '" data-idx="' + idx + '">' +
          '<span class="transcript-time">' + escapeHtml(line.time || '00:00') + '</span>' +
          '<span class="transcript-text">' + escapeHtml(line.text || '') + '</span>' +
          '</div>';
      }).join('');
    }

    function initDanmakuPrintSection(video) {
      var followBtn = document.getElementById('danmakuPrintFollowBtn');
      var listHost = document.getElementById('danmakuPrintList');
      if (!followBtn || !listHost) return;

      function syncFollowButton() {
        followBtn.classList.toggle('active', danmakuPrintState.followMode);
        followBtn.setAttribute('aria-pressed', danmakuPrintState.followMode ? 'true' : 'false');
        followBtn.title = danmakuPrintState.followMode ? 'Фоллов режим распечатки: вкл' : 'Фоллов режим распечатки: выкл';
      }

      if (!followBtn.dataset.bound) {
        followBtn.dataset.bound = '1';
        followBtn.addEventListener('click', function () {
          danmakuPrintState.followMode = !danmakuPrintState.followMode;
          syncFollowButton();
        });
      }

      if (!listHost.dataset.bound) {
        listHost.dataset.bound = '1';
        listHost.addEventListener('click', function (event) {
          var line = event.target.closest('.transcript-line');
          if (!line) return;
          var idx = Number(line.getAttribute('data-idx'));
          if (!Number.isFinite(idx)) return;
          danmakuPrintState.activeIndex = idx;
          renderDanmakuPrint(video);
        });
      }

      if (!danmakuPrintState.timerId) {
        danmakuPrintState.timerId = window.setInterval(function () {
          var panel = document.getElementById('danmakuPrintSection');
          if (!panel || !panel.classList.contains('active') || !danmakuPrintState.followMode) return;
          var lines = getDanmakuPrintLines(video);
          if (!lines.length) return;
          danmakuPrintState.activeIndex = (danmakuPrintState.activeIndex + 1) % lines.length;
          renderDanmakuPrint(video);
          var activeLine = listHost.querySelector('.transcript-line.active');
          if (activeLine) activeLine.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }, 1800);
      }

      syncFollowButton();
      renderDanmakuPrint(video);
    }

    function initDanmakuInput() {
      var input = document.getElementById('danmakuText');
      var colorBtn = document.getElementById('danmakuColorBtn');
      var colorDot = document.getElementById('danmakuColorDot');
      var posBtn = document.getElementById('danmakuPosBtn');
      var posIcon = document.getElementById('danmakuPosIcon');
      var send = document.getElementById('sendDanmaku');
      if (!input || !colorBtn || !posBtn || !send) return;
      var colors = ['#ffffff', '#ff4f9f', '#ffcc00', '#00d1ff'];
      var colorIndex = 0;
      var pos = 'scroll';

      function syncColor() {
        var c = colors[colorIndex];
        if (colorDot) colorDot.style.background = c;
      }

      function syncPos() {
        if (!posIcon) return;
        if (pos === 'top') {
          posIcon.innerHTML = '<path d="M4 8h16"></path><path d="m12 4 4 4"></path><path d="m12 4-4 4"></path>';
        } else {
          posIcon.innerHTML = '<path d="M3 12h18"></path><path d="m14 7 5 5-5 5"></path>';
        }
      }

      function submitDanmaku() {
        var text = String(input.value || '').trim();
        if (!text) return;
        window.alert('Данмаку: ' + text + ' [' + pos + ', ' + colors[colorIndex] + ']');
        input.value = '';
        input.focus();
      }

      colorBtn.addEventListener('click', function () {
        colorIndex = (colorIndex + 1) % colors.length;
        syncColor();
      });

      posBtn.addEventListener('click', function () {
        pos = pos === 'scroll' ? 'top' : 'scroll';
        syncPos();
      });

      send.addEventListener('click', submitDanmaku);
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          submitDanmaku();
        }
      });

      syncColor();
      syncPos();
    }

    var currentVideo = fallback(getNameFromQuery());
    render(currentVideo);
    initDanmakuInput();
    initCommentsComposer();
    initSectionNav();
    initDescriptionSection();
    initPlaylistsSection(currentVideo);
    initTranscriptSection(currentVideo);
    initDanmakuPrintSection(currentVideo);
    initParentChildCarousels();
    initBackButton();
  </script>
</body>
</html>
