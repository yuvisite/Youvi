<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Youvi — Шортс/Лента (PC концепт)</title>
<style>
:root{
  --bg:#ffffff;--surface:#f7f7f9;--chrome:#f2f2f7;--line:#e2e2e8;
  --text:#111111;--muted:#6f6f7a;--accent:#ff4f9f;
  --accent-bg:#ffedf6;--accent-border:#ffd3e7;
  --video-bg:#000000;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--chrome);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* HEADER */
.header{position:relative;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);height:50px;flex-shrink:0;}
.header-inner{max-width:1600px;margin:0 auto;padding:0 20px;height:100%;display:flex;align-items:center;gap:16px;}
.header-logo{display:flex;align-items:center;flex-shrink:0;text-decoration:none;}
.header-logo img{height:28px;width:auto;}
.header-search{flex:1;max-width:540px;display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);height:34px;overflow:hidden;}
.header-search input{flex:1;border:none;background:transparent;padding:0 12px;font-size:13px;color:var(--text);outline:none;}
.header-search input::placeholder{color:var(--muted);}
.header-search button{border:none;background:transparent;width:36px;height:34px;color:var(--muted);display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);flex-shrink:0;}
.header-search button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:6px;}
.hdr-btn{border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500;padding:5px 10px;border-radius:6px;display:flex;align-items:center;gap:5px;cursor:pointer;}
.hdr-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.hdr-btn.primary{background:var(--accent);color:#fff;font-weight:600;}

/* SHORTS LAYOUT */
.shorts-layout{flex:1;display:flex;justify-content:center;align-items:flex-start;height:calc(100vh - 50px);gap:24px;padding:24px 20px;}

/* FEED CONTAINER */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;}
.feed::-webkit-scrollbar{display:none;}
.feed-item{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding-bottom:24px;}

/* SHORT CARD */
.short-card{height:100%;display:flex;gap:12px;position:relative;}

/* PLAYER AREA */
.short-player{height:100%;aspect-ratio:9/16;background:var(--video-bg);border-radius:12px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;}
/* Placeholder pattern */
.short-video-placeholder{position:absolute;inset:0;background:linear-gradient(45deg,#1a1228,#2d2040);display:flex;align-items:center;justify-content:center;}
.short-video-placeholder svg{width:64px;height:64px;fill:#fff;opacity:.2;}

/* GRADIENTS/OVERLAYS */
.overlay-top{position:absolute;top:0;left:0;right:0;height:100px;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);pointer-events:none;}
.overlay-bottom{position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.4) 50%,transparent 100%);pointer-events:none;}

/* PROGRESS BAR */
.progress-container{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.2);z-index:10;}
.progress-bar{height:100%;background:var(--accent);}

/* SOUND & PLAY CONTROLS */
.ctrl-top{position:absolute;top:20px;display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 20px;z-index:10;}
.ctrl-icon{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);border:none;}
.ctrl-icon svg{width:20px;height:20px;fill:currentColor;}

/* INFO BADGE */
.info-box{position:absolute;bottom:20px;left:20px;right:20px;color:#fff;z-index:10;}
.user-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.user-avatar{width:40px;height:40px;border-radius:50%;background:#444;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
.user-name{font-size:15px;font-weight:700;}
.user-follow{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;}
.short-title{font-size:14px;line-height:1.4;margin-bottom:8px;text-shadow:0 1px 2px rgba(0,0,0,.8);}
.short-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.short-tag{background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;}
.sound-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
.sound-icon{animation:spin 4s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}

/* ACTION COLUMN */
.actions-col{width:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;gap:20px;}
.action-btn{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;color:var(--text);}
.action-icon{width:48px;height:48px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .1s;}
.action-icon svg{width:24px;height:24px;fill:currentColor;}
.action-btn:hover .action-icon{transform:scale(1.05);background:#fff;}
.action-count{font-size:13px;font-weight:700;}
.action-btn.active .action-icon{color:var(--accent);}
.action-btn.active .action-icon svg{fill:var(--accent);}

/* COMMENTS PANEL (Now side-by-side) */
.comments-panel{width:400px;height:100%;background:var(--bg);border-radius:12px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.05);display:none;flex-direction:column;flex-shrink:0;}
.comments-panel.open{display:flex;}
.cp-header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700;}
.cp-close{background:transparent;border:none;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.cp-close:hover{background:var(--surface);}
.cp-close svg{width:20px;height:20px;stroke:var(--text);stroke-width:2;}
.cp-body{flex:1;overflow-y:auto;padding:16px;}
.cp-input-area{padding:16px;border-top:1px solid var(--line);display:flex;gap:10px;}
.cp-input-area input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 16px;height:40px;outline:none;}
.cp-input-area button{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;}
.cp-input-area button svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;}

/* COMMENT ITEM */
.comment{display:flex;gap:12px;margin-bottom:16px;}
.cmt-avatar{width:32px;height:32px;border-radius:50%;background:#e0e0e0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.cmt-content{flex:1;}
.cmt-user{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px;}
.cmt-text{font-size:13px;line-height:1.4;color:var(--text);}
.cmt-actions{display:flex;align-items:center;gap:12px;margin-top:6px;}
.cmt-btn{font-size:11px;color:var(--muted);background:transparent;border:none;display:flex;align-items:center;gap:4px;cursor:pointer;}
.cmt-btn svg{width:14px;height:14px;fill:currentColor;}

</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a class="header-logo" href="youvi_main_pc_concept.html">
      <img src="images/logo_youvi_ind.png" alt="Youvi" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
      <span class="header-logo-text" style="display:none">You<span>vi</span></span>
    </a>
    <div class="header-search">
      <input type="search" placeholder="Поиск шортсов...">
      <button aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
    </div>
    <div class="header-actions">
      <button class="hdr-btn"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> Главная</button>
      <button class="hdr-btn primary">Войти</button>
    </div>
  </div>
</header>

<div class="shorts-layout">
  
  <div class="feed" id="feed">
    <!-- Shorts will be generated here by JS -->
  </div>

  <!-- FLOATING COMMENTS PANEL (applies to active video) -->
  <div class="comments-panel" id="commentsPanel">
    <div class="cp-header">
      <span>Комментарии (124)</span>
      <button class="cp-close" onclick="closeComments()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="cp-body" id="commentsBody">
      <!-- comments rendered by js -->
    </div>
    <div class="cp-input-area">
      <input type="text" placeholder="Добавить комментарий...">
      <button><svg viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4Z"/></svg></button>
    </div>
  </div>

</div><!-- /shorts-layout -->

<script>
function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtN(n){n=Number(n)||0;if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return String(n);}

// Demo Data
var shortsData = [
  {
    id: 1,
    title: 'Лучшие моменты: Атака Титанов ⚔️🔥',
    user: 'AnimeEdits',
    color: '#3d1622',
    tags: ['#anime','#aot','#eren'],
    sound: 'Original Sound - AnimeEdits',
    likes: 45200, comments: 1200, shares: 840
  },
  {
    id: 2,
    title: 'Мой новый ПК за 300,000₽ 💻✨',
    user: 'TechGuru',
    color: '#1a3040',
    tags: ['#pc','#tech','#setup'],
    sound: 'Lofi Chill Beat',
    likes: 12400, comments: 450, shares: 120
  },
  {
    id: 3,
    title: 'Прохождение ELDEN RING - Смешные моменты',
    user: 'PlayHard',
    color: '#2d3319',
    tags: ['#gaming','#eldenring','#fun'],
    sound: 'Funny BG Music',
    likes: 89000, comments: 3400, shares: 5200
  },
  {
    id: 4,
    title: 'Косплей Макима (Chainsaw Man) 🐾',
    user: 'CosplayQueen',
    color: '#401828',
    tags: ['#cosplay','#chainsawman','#makima'],
    sound: 'KICK BACK (Sped Up)',
    likes: 154000, comments: 2100, shares: 8800
  }
];

// Replicate to have more feed items
var feedItems = [];
for(var i=0; i<3; i++) {
  feedItems = feedItems.concat(shortsData);
}

var commentsHtml = [
  'Круто получилось!',
  'Сколько времени на это ушло?',
  'А какой трек играет?',
  'Первый!',
  'Жду продолжения 😍',
  'Неплохо, но можно лучше',
  'Вау, вот это монтаж!'
].map(function(t, idx){
  return '<div class="comment">'+
    '<div class="cmt-avatar" style="background:hsl('+(idx*50)+',50%,50%)">'+String.fromCharCode(65+(idx%26))+'</div>'+
    '<div class="cmt-content">'+
      '<div class="cmt-user">User_'+idx+'</div>'+
      '<div class="cmt-text">'+esc(t)+'</div>'+
      '<div class="cmt-actions">'+
        '<button class="cmt-btn"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg> '+(10+idx*5)+'</button>'+
        '<button class="cmt-btn">Ответить</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}).join('');

document.getElementById('commentsBody').innerHTML = commentsHtml;

var feedHtml = feedItems.map(function(s, idx){
  return '<div class="feed-item" data-id="'+idx+'">'+
    '<div class="short-card">'+
      '<div class="short-player" style="background:'+s.color+'">'+
        '<div class="overlay-top"></div>'+
        '<div class="short-video-placeholder"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>'+
        '<div class="ctrl-top">'+
          '<button class="ctrl-icon"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>'+
          '<button class="ctrl-icon"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zm8.54 9.54l-5.08-5.08M14.46 9.46l5.08 5.08"/></svg></button>'+
        '</div>'+
        '<div class="overlay-bottom"></div>'+
        '<div class="info-box">'+
          '<div class="user-row">'+
            '<div class="user-avatar" style="background:hsl('+(s.id*60)+',60%,40%)">'+s.user.charAt(0)+'</div>'+
            '<div class="user-name">'+esc(s.user)+'</div>'+
            '<button class="user-follow">Подписаться</button>'+
          '</div>'+
          '<div class="short-title">'+esc(s.title)+'</div>'+
          '<div class="short-tags">'+s.tags.map(function(tg){return '<span class="short-tag">'+esc(tg)+'</span>';}).join('')+'</div>'+
          '<div class="sound-row"><svg class="sound-icon" viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> '+esc(s.sound)+'</div>'+
        '</div>'+
        '<div class="progress-container"><div class="progress-bar" style="width:'+(20+Math.random()*60)+'%"></div></div>'+
      '</div>'+
      '<div class="actions-col">'+
        '<button class="action-btn" onclick="this.classList.toggle(\'active\')">'+
          '<div class="action-icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>'+
          '<span class="action-count">'+fmtN(s.likes)+'</span>'+
        '</button>'+
        '<button class="action-btn" onclick="toggleComments()">'+
          '<div class="action-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>'+
          '<span class="action-count">'+fmtN(s.comments)+'</span>'+
        '</button>'+
        '<button class="action-btn">'+
          '<div class="action-icon"><svg viewBox="0 0 24 24" style="stroke:currentColor;stroke-width:2;fill:none;stroke-linejoin:round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></div>'+
          '<span class="action-count">'+fmtN(s.shares)+'</span>'+
        '</button>'+
        '<button class="action-btn">'+
          '<div class="action-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="12" cy="19" r="2"/></svg></div>'+
        '</button>'+
        '<div class="user-avatar" style="width:36px;height:36px;border:none;background:hsl('+(s.id*60)+',60%,40%);animation:spin 4s linear infinite;box-shadow:0 0 0 4px #222"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#fff"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}).join('');

document.getElementById('feed').innerHTML = feedHtml;

var commentsPanel = document.getElementById('commentsPanel');
function toggleComments() {
  if(commentsPanel.classList.contains('open')){
    commentsPanel.classList.remove('open');
  } else {
    commentsPanel.classList.add('open');
  }
}
function closeComments() {
  commentsPanel.classList.remove('open');
}

    if(e.isIntersecting){

    }else{
      p.style.opacity = '0.5';
    }
  });
},{threshold:0.5});
document.querySelectorAll('.feed-item').forEach(function(el){ob.observe(el);});
*/
</script>
</body>
</html>
