<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мокап мобильной главной | Youvi</title>
  <style>
    :root {
      --bg: #ffffff;
      --chrome: #f2f2f7;
      --field: #f2f2f7;
      --line: #d8d8de;
      --text: #111111;
      --muted: #7a7a85;
      --accent: #ff4f9f;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--chrome);
      color: var(--text);
      line-height: 1.35;
    }

    .phone {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      border-left: 1px solid #e4e4ea;
      border-right: 1px solid #e4e4ea;
    }

    .app {
      padding: 0 16px calc(84px + var(--safe-bottom));
    }

    .header-shell {
      position: sticky;
      top: 0;
      z-index: 15;
      margin: 0 -16px 12px;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      transition: background-color 0.16s ease, border-color 0.16s ease, padding 0.16s ease;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
      transition: margin-bottom 0.16s ease;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-wrap img {
      height: 30px;
      width: auto;
      display: block;
      transition: height 0.16s ease;
    }

    .logo-label {
      font-size: 30px;
      letter-spacing: -0.02em;
      font-weight: 700;
      color: #121212;
      line-height: 1;
    }

    .scan-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 8px 12px;
      min-height: 36px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: min-height 0.16s ease, padding 0.16s ease, font-size 0.16s ease;
    }

    .scan-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-row {
      position: relative;
      margin-bottom: 0;
      max-height: 48px;
      opacity: 1;
      transform: translateY(0);
      transition: max-height 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
    }

    .search-row svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      stroke: #8b8b94;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .search-row input {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 12px;
      background: var(--field);
      color: var(--text);
      font-size: 17px;
      letter-spacing: -0.01em;
      padding: 0 12px 0 36px;
      outline: none;
    }

    .search-row input::placeholder {
      color: #8b8b94;
    }

    .phone.scrolled .header-shell {
      background: rgba(255, 255, 255, 0.92);
      border-bottom-color: #e6e6ee;
    }

    .phone.compact .header-shell {
      padding-top: calc(6px + var(--safe-top));
      padding-bottom: 8px;
    }

    .phone.compact .top {
      margin-bottom: 8px;
    }

    .phone.compact .logo-wrap img {
      height: 24px;
    }

    .phone.compact .scan-btn {
      min-height: 32px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .phone.search-hidden .search-row {
      max-height: 0;
      opacity: 0;
      transform: translateY(-8px);
      overflow: hidden;
      pointer-events: none;
    }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 14px;
      padding-bottom: 2px;
    }

    .cats::-webkit-scrollbar {
      display: none;
    }

    .cat {
      flex: 0 0 auto;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: #3a3a43;
      background: var(--field);
      border-radius: 18px;
      padding: 8px 14px;
      letter-spacing: -0.01em;
    }

    .cat.active {
      color: var(--accent);
      background: #ffedf6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 12px;
    }

    .card {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .feed-note {
      margin-top: 10px;
      font-size: 12px;
      color: #8b8b94;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      background: #ececf1;
      color: #8f8f99;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 7px;
      position: relative;
      overflow: hidden;
    }

    .thumb.has-preview {
      background-size: cover;
      background-position: center;
      color: transparent;
    }

    .video-quality {
      position: absolute;
      top: 6px;
      left: 6px;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 10px;
      line-height: 1;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0;
    }

    .video-quality[data-quality="4K"] {
      background: rgba(156, 39, 176, 0.9);
    }

    .video-quality[data-quality="1080p"] {
      background: rgba(255, 79, 159, 0.92);
    }

    .video-quality[data-quality="720p"] {
      background: rgba(52, 199, 89, 0.92);
    }

    .video-quality[data-quality="480p"] {
      background: rgba(255, 149, 0, 0.92);
    }

    .video-quality[data-quality="SD"] {
      background: rgba(99, 99, 102, 0.92);
    }

    .video-duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0, 0, 0, 0.76);
      color: #fff;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: -0.01em;
    }

    .meta svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mobile-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 430px;
      height: calc(64px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid #d9d9de;
      background: rgba(249, 249, 251, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 20;
    }

    .mobile-nav a {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: #7b7b86;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.01em;
      padding-top: 2px;
    }

    .mobile-nav a svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mobile-nav a.active {
      color: var(--accent);
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .header-shell {
        margin-left: -12px;
        margin-right: -12px;
        padding-left: 12px;
        padding-right: 12px;
      }

      .title {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <main class="app">
      <div class="header-shell">
        <header class="top">
          <div class="logo-wrap">
            <img src="images/logo_youvi_ind.png" alt="Youvi">
          </div>
          <button class="scan-btn" id="forceRefreshBtn" title="Очистить кэш и пересканировать все видео">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 1-2.4-5.7"></path>
              <path d="M20 4v4h-4"></path>
            </svg>
            <span>Скан</span>
          </button>
        </header>

        <section class="search-row" aria-label="Поиск">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M16 16L21 21"></path>
          </svg>
          <input type="text" placeholder="Поиск видео">
        </section>
      </div>

      <nav class="cats" aria-label="Категории">
        <a class="cat active" href="#">All</a>
        <a class="cat" href="#">Anime</a>
        <a class="cat" href="#">Animation</a>
        <a class="cat" href="#">Games</a>
        <a class="cat" href="#">Series</a>
        <a class="cat" href="#">Movies</a>
        <a class="cat" href="#">Music</a>
        <a class="cat" href="#">Technology</a>
        <a class="cat" href="#">Education</a>
        <a class="cat" href="#">Other</a>
      </nav>

      <section class="grid" aria-label="Лента" id="videoGrid"></section>
      <p class="feed-note" id="feedNote">Загрузка видео...</p>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Нижняя навигация">
    <a href="#" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path><path d="M9.5 20v-5h5V20"></path></svg>
      <span>Главная</span>
    </a>
    <a href="youvi_tags_mobile_mockup.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 12 20 4 12V5h8l8 7Z"></path><circle cx="8" cy="8" r="1.3"></circle></svg>
      <span>Теги</span>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7.5" height="7.5" rx="1.4"></rect><rect x="13.5" y="4" width="7.5" height="7.5" rx="1.4"></rect><rect x="3" y="14.5" width="7.5" height="7.5" rx="1.4"></rect><rect x="13.5" y="14.5" width="7.5" height="7.5" rx="1.4"></rect></svg>
      <span>Разделы</span>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12a1 1 0 0 1 1 1v16l-7-3-7 3v-16a1 1 0 0 1 1-1Z"></path></svg>
      <span>Подписки</span>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
      <span>Мой профиль</span>
    </a>
  </nav>

  <script>
    (function () {
      var phone = document.querySelector('.phone');
      var lastY = window.scrollY || 0;

      function onScroll() {
        var y = window.scrollY || 0;
        phone.classList.toggle('scrolled', y > 20);
        phone.classList.toggle('compact', y > 24);

        if (y > lastY + 6 && y > 80) {
          phone.classList.add('search-hidden');
        } else if (y < lastY - 4) {
          phone.classList.remove('search-hidden');
        }

        if (y < 20) {
          phone.classList.remove('search-hidden');
        }

        lastY = y;
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatViews(value) {
      var n = Number(value) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    function normalizeDuration(value) {
      if (!value) return '0:00';
      var s = String(value).trim();
      if (/^\d+:\d{2}(:\d{2})?$/.test(s)) return s;
      var sec = Number(s);
      if (Number.isFinite(sec) && sec > 0) {
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var z = Math.floor(sec % 60);
        if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(z).padStart(2, '0');
        return m + ':' + String(z).padStart(2, '0');
      }
      return '0:00';
    }

    function normalizeQuality(raw) {
      var q = String(raw || '').toUpperCase();
      if (q === '4K' || q === '1080P' || q === '720P' || q === '480P' || q === 'SD') return q.replace('P', 'p');
      return 'SD';
    }

    function renderVideoCards(videos) {
      var grid = document.getElementById('videoGrid');
      grid.innerHTML = videos.map(function (video) {
        var safeName = escapeHtml(video.name);
        var videoNameParam = encodeURIComponent(String(video.name || ''));
        var quality = normalizeQuality(video.quality);
        var duration = normalizeDuration(video.duration);
        var views = formatViews(video.views) + ' просмотров';
        var previewStyle = video.preview ? ' style="background-image:url(\'' + String(video.preview).replace(/'/g, '%27') + '\')"' : '';
        var previewClass = video.preview ? 'thumb has-preview' : 'thumb';
        return '' +
          '<a class="card" href="youvi_video_mobile_mockup.html?v=' + videoNameParam + '" data-video-name="' + safeName + '">' +
          '<div class="' + previewClass + '"' + previewStyle + '>16:9' +
          '<span class="video-quality" data-quality="' + quality + '">' + quality + '</span>' +
          '<span class="video-duration">' + duration + '</span>' +
          '</div>' +
          '<div class="title">' + safeName + '</div>' +
          '<div class="meta">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-5 10-5 10 5 10 5-4 5-10 5-10-5-10-5Z"></path><circle cx="12" cy="12" r="2"></circle></svg>' +
          '<span>' + views + '</span>' +
          '</div>' +
          '</a>';
      }).join('');
    }

    function getMockVideos() {
      return [
        { name: 'Название карточки 1', quality: '1080p', duration: '12:43', views: 12000 },
        { name: 'Название карточки 2', quality: '4K', duration: '08:17', views: 8400 },
        { name: 'Название карточки 3', quality: '720p', duration: '21:05', views: 2100 },
        { name: 'Название карточки 4', quality: '480p', duration: '03:56', views: 1200 },
        { name: 'Название карточки 5', quality: 'SD', duration: '27:31', views: 934 },
        { name: 'Название карточки 6', quality: '1080p', duration: '10:22', views: 410 },
        { name: 'Название карточки 7', quality: '4K', duration: '14:09', views: 6800 },
        { name: 'Название карточки 8', quality: '720p', duration: '06:41', views: 3300 },
        { name: 'Название карточки 9', quality: '1080p', duration: '18:54', views: 11000 },
        { name: 'Название карточки 10', quality: 'SD', duration: '04:12', views: 790 }
      ];
    }

    async function loadVideosFromIndexedDB() {
      return new Promise(function (resolve) {
        try {
          var req = indexedDB.open('8SiteDB', 1);
          req.onsuccess = function () {
            try {
              var db = req.result;
              if (!db.objectStoreNames.contains('videos')) {
                resolve([]);
                return;
              }
              var tx = db.transaction('videos', 'readonly');
              var store = tx.objectStore('videos');
              var list = [];
              var cursorReq = store.openCursor();
              cursorReq.onsuccess = function (event) {
                var cursor = event.target.result;
                if (cursor) {
                  list.push(cursor.value);
                  cursor.continue();
                } else {
                  list.sort(function (a, b) {
                    return Number(b.created || b.modified || 0) - Number(a.created || a.modified || 0);
                  });
                  resolve(list);
                }
              };
              cursorReq.onerror = function () { resolve([]); };
            } catch (_) {
              resolve([]);
            }
          };
          req.onerror = function () { resolve([]); };
        } catch (_) {
          resolve([]);
        }
      });
    }

    async function initDemoFeed() {
      var note = document.getElementById('feedNote');
      var videos = await loadVideosFromIndexedDB();
      if (Array.isArray(videos) && videos.length > 0) {
        renderVideoCards(videos.slice(0, 20));
        note.textContent = 'Демо: загружено из кэша Youvi (IndexedDB)';
      } else {
        renderVideoCards(getMockVideos());
        note.textContent = 'Демо: кэш не найден, показаны мокапные карточки';
      }
    }

    initDemoFeed();

    document.getElementById('forceRefreshBtn').addEventListener('click', function () {
      var ok = confirm('Очистить кэш и пересканировать все видео? Это может занять некоторое время.');
      if (ok) {
        localStorage.removeItem('lastVideoScan');
        localStorage.removeItem('lastPlaylistScan');
        location.reload();
      }
    });
  </script>
</body>
</html>
